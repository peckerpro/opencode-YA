<!DOCTYPE html><html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YA Console</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;--accent:#58a6ff;--green:#3fb950;--yellow:#d2991d;--red:#f85149;--code-bg:#1a1a2e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:13px}
header b{color:var(--accent)}#sid{font-size:11px;opacity:0.5}#status{font-size:11px;margin-left:auto}
main{flex:1;display:flex;overflow:hidden}
#sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#sidebar h3{padding:10px 12px 6px;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px}
#session-list{flex:1;overflow-y:auto;padding:0}
#session-list div{padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#session-list div:hover{background:var(--border)}
#session-list div.active{background:var(--accent);color:#fff}
#content{flex:1;display:flex;flex-direction:column;overflow:hidden}
nav{display:flex;gap:0;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
nav button{background:transparent;border:none;color:var(--text);padding:8px 14px;cursor:pointer;font-size:12px;border-bottom:2px solid transparent}
nav button:hover{color:var(--accent)}nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:none;flex:1;flex-direction:column;padding:12px;overflow-y:auto}.panel.active{display:flex}
#chat-msgs{flex:1;overflow-y:auto;margin-bottom:10px}
.msg{margin-bottom:8px;padding:8px 12px;border-radius:6px;font-size:13px;line-height:1.5;max-width:85%}
.msg.user{background:var(--accent);color:#fff;margin-left:auto}
.msg.assistant{background:var(--surface);border:1px solid var(--border)}
.msg.assistant code{background:var(--code-bg);padding:1px 4px;border-radius:3px;font-size:12px}
.msg.assistant pre{background:var(--code-bg);padding:8px;border-radius:4px;overflow-x:auto;margin:4px 0;font-size:11px}
.msg.assistant pre code{padding:0;background:transparent}
.msg.assistant strong{color:#fff}.msg.assistant h3{font-size:13px;margin:6px 0 3px;color:var(--accent)}
.msg.assistant ul,.msg.assistant ol{padding-left:18px;margin:3px 0}.msg.assistant p{margin:3px 0}
.msg.tool{background:#1a2332;font-family:monospace;font-size:11px;border:1px solid var(--yellow)}
.msg.system{text-align:center;font-size:11px;opacity:0.5;max-width:100%}
.chat-input{display:flex;gap:6px;flex-shrink:0}
.chat-input input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;outline:none}
.chat-input input:focus{border-color:var(--accent)}
.chat-input button{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border)}th{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px}
.card h3{font-size:13px;margin-bottom:6px;color:var(--accent)}
.ok{color:var(--green)}.warn{color:var(--yellow)}.err{color:var(--red)}
</style></head>
<body>
<header><b>YA Console</b><span id="sid"></span><span id="status">● checking</span></header>
<main>
<div id="sidebar"><h3>Sessions</h3><div id="session-list"></div></div>
<div id="content">
<nav>
<button class="active" data-panel="chat">Chat</button>
<button data-panel="tools">Tools</button>
<button data-panel="memory">Memory</button>
<button data-panel="cron">Cron</button>
<button data-panel="system">System</button>
</nav>
<div id="chat" class="panel active"><div id="chat-msgs"></div>
<div class="chat-input"><input id="chat-input" placeholder="Type /help for commands..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div></div>
<div id="tools" class="panel"><div id="tools-content">Loading...</div></div>
<div id="memory" class="panel"><div id="memory-content">Loading...</div></div>
<div id="cron" class="panel"><div id="cron-content">Loading...</div></div>
<div id="system" class="panel"><div id="system-content">Loading...</div></div>
</div></main>
<script>
const A='';let SID=localStorage.getItem('ya-sid')||'';
E('sid').textContent=SID?'session:'+SID.slice(0,8):'new';
function E(id){return document.getElementById(id)}
function saveSid(sid){SID=sid;localStorage.setItem('ya-sid',sid);E('sid').textContent='session:'+sid.slice(0,8);loadSessions()}

async function chk(){try{let r=await fetch(A+'/health');let d=await r.json();E('status').innerHTML='● '+d.status;E('status').className='ok'}catch(e){E('status').innerHTML='● offline';E('status').className='err'}}
chk();setInterval(chk,15000);
loadSessions();setInterval(loadSessions,10000);

async function loadSessions(){try{let r=await fetch(A+'/api/sessions');let ss=await r.json();let h='';for(let s of ss.reverse())h+='<div class="'+(s.id===SID?'active':'')+'" onclick="switchSession(\''+s.id+'\')">'+(s.title||s.id.slice(0,8))+' <span style="font-size:10px;opacity:0.5">'+s.status+'</span></div>';h+='<div style="padding:8px 12px;cursor:pointer;color:var(--accent)" onclick="switchSession(\'\')">+ New Session</div>';E('session-list').innerHTML=h}catch(e){}}

function switchSession(sid){saveSid(sid);E('chat-msgs').innerHTML='';addMsg('system','Switched to '+(sid?sid.slice(0,8):'new session'))}

function sw(n){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));E(n).classList.add('active');document.querySelector('[data-panel="'+n+'"]').classList.add('active');if(n==='tools')ldT();if(n==='memory')ldM();if(n==='cron')ldC();if(n==='system')ldS()}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>sw(b.dataset.panel)));

function md2html(t){t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');t=t.replace(/^### (.+)$/gm,'<h3>$1</h3>');t=t.replace(/^## (.+)$/gm,'<h3>$1</h3>');t=t.replace(/^# (.+)$/gm,'<h3>$1</h3>');t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');t=t.replace(/`([^`]+)`/g,'<code>$1</code>');t=t.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>');t=t.replace(/^- (.+)$/gm,'<li>$1</li>');t=t.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');t=t.replace(/\n\n/g,'</p><p>');t='<p>'+t+'</p>';return t}

async function send(){let i=E('chat-input'),m=i.value.trim();if(!m)return;i.value='';addMsg('user',m);
try{let b={message:m};if(SID)b.session_id=SID;let r=await fetch(A+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let d=await r.json();
if(d.session_id&&d.session_id!==SID)saveSid(d.session_id);
if(d.response)addMsg('assistant',d.response,true);else addMsg('system','No response');
if(d.tool_calls)for(let t of d.tool_calls)addMsg('tool','🔧 '+t.name+': '+t.result)}catch(e){addMsg('system','API unavailable')}}

function addMsg(role,content,isMd){let d=document.createElement('div');d.className='msg '+role;d.innerHTML=isMd?md2html(content):content;E('chat-msgs').appendChild(d);d.scrollIntoView({behavior:'smooth'})}

async function ldT(){try{let r=await fetch(A+'/api/tools'),d=await r.json(),h='<div class="card"><h3>Tools ('+d.length+')</h3><table><tr><th>Name</th><th>Risk</th><th>Enabled</th></tr>';for(let t of d)h+='<tr><td>'+t.name+'</td><td class="'+(t.risk==='safe'?'ok':t.risk==='dangerous'?'err':'warn')+'">'+t.risk+'</td><td>'+(t.enabled?'✓':'✗')+'</td></tr>';h+='</table></div>';E('tools-content').innerHTML=h}catch(e){}}
async function ldM(){try{let r=await fetch(A+'/api/memory'),d=await r.json(),h='<div class="card"><h3>Memories ('+d.total+')</h3>';if(d.memories)for(let m of d.memories)h+='<div class="card"><b>'+m.title+'</b><br><span style="font-size:11px;opacity:0.7">'+m.id+' | '+m.type+' | '+m.tags+'</span></div>';h+='</div>';E('memory-content').innerHTML=h}catch(e){}}
async function ldC(){try{let r=await fetch(A+'/api/cron/jobs'),d=await r.json(),h='<div class="card"><h3>Cron Jobs ('+d.total+')</h3>';if(d.jobs&&d.jobs.length){h+='<table><tr><th>ID</th><th>Name</th><th>Type</th><th>Status</th></tr>';for(let j of d.jobs)h+='<tr><td>'+j.id.slice(0,8)+'</td><td>'+j.name+'</td><td>'+j.type+'</td><td>'+j.status+'</td></tr>';h+='</table>'}else h+='<p>No jobs</p>';h+='</div>';E('cron-content').innerHTML=h}catch(e){}}
async function ldS(){try{let r=await fetch(A+'/api/root/status'),d=await r.json();let s=await fetch(A+'/api/sessions'),ss=await s.json();E('system-content').innerHTML='<div class="card"><h3>System</h3><p>Sessions: '+ss.length+' total</p><p>Memories: '+d.total_memories+'</p><p>Cron: '+d.active_jobs+' jobs</p><p>Tools: '+d.tools_registered+'</p></div>'}catch(e){}}
</script></body></html>
